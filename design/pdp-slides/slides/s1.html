<!doctype html><meta charset="utf-8"><title>S1 Benefit Stack</title>
<link rel="stylesheet" href="_base.css">
<style>
.slide{background:radial-gradient(120% 100% at 6% 2%, #fff 0%, #f5f7fa 44%, #e9edf3 100%)}

/* Bottle emerging from the bottom-right corner, cropped by both edges
   (GrayMatter treatment). Cut out from the 2752px studio shot. */
.shot{position:absolute;right:-40px;bottom:-170px;height:1460px;z-index:1;
  filter:drop-shadow(-34px 34px 54px rgba(27,39,87,.26))}

h1{font-family:Favorit;font-weight:500;font-size:152px;line-height:1;
  letter-spacing:-.03em;max-width:1400px;position:relative;z-index:3}
h1 em{font-style:italic}

.sub{font-weight:500;font-size:74px;line-height:1.2;letter-spacing:-.018em;
  color:#2f3a63;margin-top:32px;max-width:1180px;position:relative;z-index:3}

ul{list-style:none;margin-top:74px;max-width:1250px;position:relative;z-index:3}
li{display:flex;align-items:center;gap:38px;padding:25px 0;
  border-bottom:2px solid rgba(27,39,87,.16);
  font-weight:500;font-size:82px;letter-spacing:-.022em;color:var(--navy)}
li:last-child{border-bottom:0}

.ic{flex:0 0 112px;width:112px;height:112px;border-radius:50%;background:#dde4f0;
  display:flex;align-items:center;justify-content:center}
.ic svg{width:66px;height:64px;stroke:var(--navy);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.ic svg .fl{fill:var(--navy);stroke:none}

.foot{position:absolute;left:var(--pad);bottom:94px;display:flex;align-items:center;
  gap:30px;z-index:3}
.foot img{width:148px}
.foot span{font-family:JBM,monospace;font-size:36px;font-weight:500;letter-spacing:.09em;
  line-height:1.5;color:#3f4a75}
</style>
<div class="slide">
  <img class="shot" src="../assets/FlowCutout.png">

  <h1>A <em>Sharper</em> Mind.</h1>
  <div class="sub">The daily morning brain shot for sharper, calmer focus.</div>

  <ul>
    <li><span class="ic"><svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/>
      <circle class="fl" cx="12" cy="12" r="1.8"/></svg></span>Focus &amp; Clarity</li>

    <li><span class="ic"><svg viewBox="0 0 24 24">
      <path d="M13.4 2.2 5.8 13.3h5.2L10.3 21.8 18.2 10.4h-5.3z"/></svg></span>All-Day Energy</li>

    <li><span class="ic"><svg viewBox="0 0 24 24">
      <path d="M2.6 8.2c1.9-1.9 3.9-1.9 5.8 0s3.9 1.9 5.8 0 3.9-1.9 5.8 0"/>
      <path d="M2.6 13c1.9-1.9 3.9-1.9 5.8 0s3.9 1.9 5.8 0 3.9-1.9 5.8 0"/>
      <path d="M2.6 17.8c1.9-1.9 3.9-1.9 5.8 0s3.9 1.9 5.8 0 3.9-1.9 5.8 0"/>
      </svg></span>Calm Under Pressure</li>

    <li><span class="ic"><svg viewBox="0 0 24 24">
      <path d="M4.5 19.5h15"/>
      <path d="M7.4 19.5v-4.6M12 19.5V9.9M16.6 19.5V4.8"/>
      </svg></span>Stronger Cognition</li>
  </ul>

  <div class="foot"><img src="../../../public/logos/InformedSportLogo.png">
    <span>6 CLINICALLY DOSED ADAPTOGENS<br>INFORMED SPORT CERTIFIED</span></div>
</div>
